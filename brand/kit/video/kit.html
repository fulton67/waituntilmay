<!-- Ostad video kit (BUILDER Phase F). Every element is the still kit (kit.css + templates) animated by one deterministic timeline:
     window.VK.seek(name, t) poses element `name` at time t (seconds), so scripts/video_kit.cjs can capture exact frames.
     Durations and easings come from motion/rules.json through kit/tokens.json (inlined below by templates_build.mjs as RULES). -->
<meta charset="utf-8"><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://use.typekit.net/vzz0hgt.css"><link rel="stylesheet" href="https://use.typekit.net/rwy7toj.css"><!-- rwy7toj: Elza 400/600/700, captions + lower third -->

<style>

     inset rims (::after), soft drop shadow; name in Elza Bold, role in Elza Regular caps, dark ink (his card reference). Sits directly

  .vk-lt { position: absolute; left: var(--ok-margin); right: var(--ok-margin); padding: 3.3cqw 4.4cqw; display: grid; gap: 1.2cqw; border-radius: 3.6cqw;
    color: #1c1c1e; isolation: isolate; overflow: hidden; box-shadow: 0 1.1cqw 1.1cqw rgba(0,0,0,.2), 0 0 3.7cqw rgba(0,0,0,.1); }
  .vk-lt::before { content: ""; position: absolute; inset: 0; z-index: -2; -webkit-backdrop-filter: blur(2.4cqw); backdrop-filter: blur(2.4cqw); filter: url(#vk-glass-distortion); }
  .vk-lt::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: rgba(255,255,255,.5);
    box-shadow: inset 0.55cqw 0.55cqw 0.28cqw 0 rgba(255,255,255,.55), inset -0.28cqw -0.28cqw 0.28cqw 0.28cqw rgba(255,255,255,.5); }
  .vk-lt .n { margin: 0; font: 700 4.1cqw/1.1 "elza", sans-serif; letter-spacing: -0.005em; }
  .vk-lt .r { margin: 0; font: 400 3.5cqw/1.1 "elza", sans-serif; letter-spacing: 0.01em; text-transform: uppercase; }
  /* caption standard (client direction 2026-11-08, DECISIONS 65): no panel; Elza Bold, white, "size 17" as in the client's reference
     frame (Screenshot 2026-11-08 171541: "dealing with inflamatory" spans 301/360 = 83.6% of the width), measured: 75.4 px = 6.98cqw at
     1080 with 0.02em tracking; a 4 px black stroke outside the letters (an 8 px centred stroke painted under the fill);

  .vk { --vk-cap-size: 6.98cqw; --vk-cap-stroke: calc(4 / 1080 * 100cqw); }

  .vk-chip { position: absolute; left: var(--ok-margin); top: calc(var(--safe-t) + 2cqw); }
  .vk-chip .ok-pill { background: rgba(var(--ok-surface-rgb), var(--ok-glass-alpha)); -webkit-backdrop-filter: blur(var(--ok-glass-blur)); backdrop-filter: blur(var(--ok-glass-blur)); }
  .vk-rev { position: absolute; left: var(--ok-margin); right: var(--ok-margin); top: 38%; }

     edits/rosacea-laser); the label is a glass pill inset on the photo. tile-pair = A vs B side by side. (DECISIONS 62) */
  .vk-tiles { position: absolute; left: var(--ok-margin); right: var(--ok-margin); display: flex; justify-content: center; align-items: center; gap: 2.4cqw; }
  .vk-tile { position: relative; }

  .vk-tiles--pair .vk-tile img { width: 26cqw; }

  /* machine: the cutout alone, full size, no panel (client direction 2026-11-08, DECISIONS 64): right side of the frame between the safe top and
     the caption band, name under it in the kit ink with a light halo (his walls are light); pops in with an overshoot, sways a little while it holds, pops out */
  .vk-dev { position: absolute; right: 2.5cqw; top: calc(var(--safe-t) + 1cqw); width: 31cqw; display: grid; justify-items: center; gap: 1.2cqw; transform-origin: 50% 100%; }
  .vk-dev img { display: block; width: 100%; height: 34vh; object-fit: contain; object-position: 100% 100%; filter: drop-shadow(0 2cqw 2.4cqw rgba(0,0,0,.28)); }
  .vk-dev .n { margin: 0; font: 600 var(--ok-caption-size)/1.1 var(--ok-display); letter-spacing: var(--ok-headline-track); color: var(--ok-text); text-shadow: 0 0 1.2cqw rgba(255,255,255,.9), 0 0 0.4cqw rgba(255,255,255,.9); text-align: center; }

</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="vk-glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox"><feTurbulence type="fractalNoise" baseFrequency="0.001 0.005" numOctaves="1" seed="17" result="turbulence"/><feGaussianBlur in="turbulence" stdDeviation="3" result="softMap"/><feDisplacementMap in="SourceGraphic" in2="softMap" scale="200" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div id="stage"><img id="bg" alt=""><div id="layer" class="ok ok--9x16 ok--clear"></div></div>
<script type="module">
import * as E from "../templates/engine.js";
const RULES = await (await fetch("../tokens.json")).json();
const ms = (k) => parseFloat(RULES.motion.duration[k].$value) / 1000;
const BAND_TOP = RULES.video["caption-band-top"].$value;
const bz = (k) => RULES.motion.easing[k].$value;
// cubic-bezier easing, solved by bisection on x
function bezier([x1, y1, x2, y2]) {
  const c = (a, b, t) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, t = x; for (let i = 0; i < 30; i++) { t = (lo + hi) / 2; if (c(x1, x2, t) < x) lo = t; else hi = t; } return c(y1, y2, t); };
}
const OUT = bezier(bz("out")), IN = bezier(bz("in")), INOUT = bezier(bz("in-out"));
const RISE = 1.2, BLUR = 0.8; // cqw, motion/rules.json distance
const clamp = (v) => Math.max(0, Math.min(1, v));
// reveal effects: p in 0..1 -> inline style
const FX = {
  "fade-rise": (p) => `opacity:${p};transform:translateY(${(1 - p) * RISE}cqw)`,
  "fade": (p) => `opacity:${p}`,
  "cut": (p) => `opacity:${p > 0 ? 1 : 0}`,
  "blur-in": (p) => `opacity:${p};filter:blur(${(1 - p) * BLUR}cqw)`,
  "mask-up": (p) => `clip-path:inset(${(1 - p) * 100}% 0 -20% 0);transform:translateY(${(1 - p) * RISE * 2}cqw)`,
  "tracking": (p) => `opacity:${p};letter-spacing:calc(var(--ok-headline-track) + ${(1 - p) * 0.08}em)`,
  "scale-in": (p) => `opacity:${p};transform:scale(${0.94 + 0.06 * p});transform-origin:0 50%`,
};
// an item: { sel, fx, at (s), dur (s, default enter), stagger (s, for children), out (s, exit start; default none) }
function pose(root, items, t) {
  for (const it of items) {
    const els = it.children ? root.querySelectorAll(`${it.sel} > *`) : root.querySelectorAll(it.sel);
    els.forEach((el, i) => {
      const t0 = it.at + i * (it.stagger || 0), d = it.dur ?? ms("enter");
      let p = OUT(clamp((t - t0) / d)), st = FX[it.fx](p);
      if (it.out != null && t >= it.out) { const q = it.fx === "cut" ? 0 : 1 - IN(clamp((t - it.out) / ms("exit"))); st += `;opacity:${Math.min(p, q)}`; }
      const base = el.dataset.base ?? (el.dataset.base = el.getAttribute("style") || ""); // keep authored inline style (caption band top)
      el.setAttribute("style", base + ";" + st);
    });
  }
}
const words = (s) => s.split(" ").map((w) => `<span>${w} </span>`).join("");
const lines = (arr) => arr.map((l) => `<span class="ln">${l}</span>`).join("");
const ENTER = ms("enter"), EXIT = ms("exit"), HOLD = ms("hold-min"), STAG = ms("stagger");
const lenOf = (enter, holdTo) => holdTo + EXIT;
const HEAD = "Natural results come from restraint.";
// ---- registry ----
const EL = {
  "lower-third": { dur: 0.2 + ENTER + HOLD + 0.6 + EXIT, html: `<div class="vk-lt" style="bottom:calc(${(1 - BAND_TOP) * 100}% + 2cqw)"><p class="n">Dr. Ariel Ostad</p><p class="r">Triple board-certified dermatologist</p></div>`,
    tl: (d) => [{ sel: ".vk-lt", fx: "fade-rise", at: 0.2, out: d - EXIT }, { sel: ".vk-lt .r", fx: "fade", at: 0.2 + STAG * 2, out: d - EXIT }] },
  "caption": { dur: 0.1 + HOLD + 0.5, html: `<div class="vk-cap" style="top:${BAND_TOP * 100}%"><p>Sessions take about twenty minutes.</p></div>`,
    tl: (d) => [{ sel: ".vk-cap", fx: "cut", at: 0.1, dur: 0.001, out: d - 0.04 }] },
  "chip": { dur: 0.2 + ENTER + HOLD + EXIT, html: `<div class="vk-chip"><span class="ok-pill">+ Ellacor</span></div>`,
    tl: (d) => [{ sel: ".vk-chip", fx: "scale-in", at: 0.2, out: d - EXIT }] },
  // fillable (VK.reel overlays fill [data-f] by key: img src or text): tile, tile-pair, device
  "tile": { dur: 0.2 + ENTER + HOLD + EXIT, html: `<div class="vk-tiles" style="bottom:calc(${(1 - BAND_TOP) * 100}% + 1.5cqw)"><div class="vk-tile"><span class="ok-pill" data-f="label">Dry skin</span><img data-f="img" alt=""></div></div>`,
    tl: (d) => [{ sel: ".vk-tile", fx: "scale-in", at: 0.2, out: d - EXIT }] },
  "tile-pair": { dur: 0.2 + ENTER + HOLD + 1 + EXIT, html: `<div class="vk-tiles vk-tiles--pair" style="bottom:calc(${(1 - BAND_TOP) * 100}% + 1.5cqw)"><div class="vk-tile"><span class="ok-pill" data-f="label">Option A</span><img data-f="img" alt=""></div><span class="vk-vs">vs</span><div class="vk-tile"><span class="ok-pill" data-f="label2">Option B</span><img data-f="img2" alt=""></div></div>`,
    tl: (d) => [{ sel: ".vk-tiles--pair", children: true, fx: "fade-rise", at: 0.2, stagger: STAG * 2, out: d - EXIT }] },
  "device": { dur: 5.2, html: `<div class="vk-dev"><img data-f="img" alt=""><p class="n" data-f="label">Excel V</p><p class="m" data-f="maker">Cutera</p></div>`,
    custom: (root, t, d = 5.2) => { // pop in 0.15-0.65 s with overshoot, sway (rotate +-2.2deg, drift +-1.4cqw, float 0.8cqw) while it holds, pop out over EXIT
      const el = root.querySelector(".vk-dev"), pin = clamp((t - 0.15) / 0.5), pout = clamp((t - (d - EXIT)) / EXIT);
      const back = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (p - 1) ** 3 + c1 * (p - 1) ** 2; }; // easeOutBack
      const sc = (pin <= 0 ? 0.55 : 0.55 + 0.45 * back(pin)) * (1 - 0.35 * IN(pout)), op = Math.min(OUT(clamp((t - 0.15) / 0.25)), 1 - IN(pout));
      const w = Math.min(1, clamp((t - 0.4) / 0.6)) * (1 - pout), ph = (t - 0.4) * 2 * Math.PI / 3.2;
      el.setAttribute("style", `opacity:${op};transform:translate(${(Math.sin(ph) * 1.4 * w).toFixed(3)}cqw,${(Math.sin(ph * 2) * -0.8 * w).toFixed(3)}cqw) rotate(${(Math.sin(ph + 0.6) * 2.2 * w).toFixed(3)}deg) scale(${sc.toFixed(4)})`);
      root.querySelector(".vk-dev .n").style.opacity = OUT(clamp((t - 0.45) / 0.4)); } },
  "reveal-fade-rise": { dur: 3, html: `<div class="vk-rev"><h1>${HEAD}</h1></div>`, tl: (d) => [{ sel: ".vk-rev h1", fx: "fade-rise", at: 0.2, dur: ms("enter-slow"), out: d - EXIT }] },
  "reveal-line-stagger": { dur: 3, html: `<div class="vk-rev"><h1>${lines(["Natural results", "come from", "restraint."])}</h1></div>`, tl: (d) => [{ sel: ".vk-rev h1", children: true, fx: "fade-rise", at: 0.2, stagger: STAG * 2, out: d - EXIT }] },
  "reveal-word-stagger": { dur: 3, html: `<div class="vk-rev"><h1>${words(HEAD)}</h1></div>`, tl: (d) => [{ sel: ".vk-rev h1", children: true, fx: "fade-rise", at: 0.2, stagger: STAG, out: d - EXIT }] },
  "reveal-mask-up": { dur: 3, html: `<div class="vk-rev"><h1>${lines(["Natural results", "come from", "restraint."])}</h1></div>`, tl: (d) => [{ sel: ".vk-rev h1", children: true, fx: "mask-up", at: 0.2, stagger: STAG * 1.5, dur: ms("enter-slow"), out: d - EXIT }] },
  "reveal-blur-in": { dur: 3, html: `<div class="vk-rev"><h1>${HEAD}</h1></div>`, tl: (d) => [{ sel: ".vk-rev h1", fx: "blur-in", at: 0.2, dur: ms("enter-slow"), out: d - EXIT }] },
  "reveal-tracking": { dur: 3, html: `<div class="vk-rev"><h1>${HEAD}</h1></div>`, tl: (d) => [{ sel: ".vk-rev h1", fx: "tracking", at: 0.2, dur: ms("enter-slow"), out: d - EXIT }] },
  "transition-glass-wipe": { dur: 1, html: `<div class="vk-wipe"></div>`, custom: (root, t) => { const p = INOUT(clamp(t / 1)); root.querySelector(".vk-wipe").setAttribute("style", `top:${(1 - p * 2) * 100}%`); } },
  "transition-dip-paper": { dur: 1, html: `<div class="vk-dip"></div>`, custom: (root, t) => { const p = t < 0.5 ? INOUT(t / 0.5) : 1 - INOUT((t - 0.5) / 0.5); root.querySelector(".vk-dip").setAttribute("style", `opacity:${p}`); } },
};
// title and end cards per template family: the 9:16 template itself, its text revealed by the same timeline
const PH = (await (await fetch("../templates/photos/photos.json")).json()).map((p) => p.src);
const CARDS = {
  editorial: { title: { template: "single-statement", slots: { statement: "Imperfection helps you connect with the work.", ground: "paper" } },
               end: { template: "single-statement", slots: { statement: "Book a consultation. Link in bio.", byline: "@drarielostad", ground: "dark" } } },
  clinical: { title: { template: "procedure-card", slots: { image: PH[0], chip: "Injectable", name: "Hyaluronic acid filler", what: "Restores lost volume, with results the same day.", icon: "syringe" } },
              end: { template: "carousel-end", slots: { image: PH[0] } } },
  event: { title: { template: "announcement", slots: { image: PH[0] } },
           end: { template: "single-statement", slots: { statement: "See you on the 20th. Register in bio.", byline: "Dr. Ariel Ostad", ground: "paper" } } },
  guide: { title: { template: "carousel-cover", slots: { image: PH[0], ground: "image" } },
           end: { template: "carousel-end", slots: { image: PH[0], heading: "Save this guide" } } },
};
const CARD_TL = [{ sel: ".ok-pill, .ok-glass, .card", fx: "fade-rise", at: 0.15 }, { sel: ".ok-h", fx: "fade-rise", at: 0.3, dur: ms("enter-slow") },
                 { sel: ".ok-c, .date, .details, .meta", fx: "fade", at: 0.3 + STAG * 4 }, { sel: ".ok-l, .ok-meta, .cta, .by, .ok-box", fx: "fade", at: 0.3 + STAG * 6 }];
for (const [fam, c] of Object.entries(CARDS)) for (const kind of ["title", "end"]) EL[`card-${fam}-${kind}`] = { dur: 3, card: c[kind], tl: () => CARD_TL };

const layer = document.getElementById("layer"), bg = document.getElementById("bg"); let cur = null;
async function mount(name) {
  const el = EL[name]; if (!el) throw new Error("unknown element " + name);
  document.getElementById("cardhost")?.remove(); // one element on stage at a time
  if (el.card) {
    const r = await E.render(layer.parentElement.appendChild(Object.assign(document.createElement("div"), { id: "cardhost" })), { size: "9x16", accent: "accent-1", slides: [el.card], labelFallback: false });
    layer.style.display = "none"; cur = { name, root: document.querySelector("#cardhost > .ok"), fonts: r.fonts };
    cur.root.querySelectorAll("[data-count]").forEach((e) => e.remove());

    layer.style.display = ""; layer.innerHTML = `<div class="vk">${el.html}</div>`; cur = { name, root: layer };
  }

}
window.VK = {
  names: Object.keys(EL), dur: (n) => EL[n].dur,
  async seek(name, t) {
    if (!cur || cur.name !== name) await mount(name);

    if (el.custom) el.custom(cur.root, t); else pose(cur.root, el.tl(el.dur), t);
    return true;
  },
  background(src) { if (src) { bg.src = src; bg.style.display = "block"; return bg.decode(); } bg.style.display = "none"; return Promise.resolve(); },
  // a reel (scripts/video_reel.cjs): footage frames under overlays, speech captions cut on in the band, an end card dissolved in.
  // spec = { overlays: [{ name, at, text? }], captions: [{ text, from, to }], end: { card, at, dissolve }, capWide (default true; false = the
  // measured caption block, for footage with no burnt-in captions) }

      for (const o of spec.overlays) {
        const h = mk(); h.innerHTML = `<div class="vk">${EL[o.name].html}</div>`;
        for (const [k, v] of Object.entries(o.fill || {})) h.querySelectorAll(`[data-f="${k}"]`).forEach((e) => { if (e.tagName === "IMG") e.src = v; else e.textContent = v; });
        if (o.text) { const tx = h.querySelector(".ok-pill, .vk-cap p"); if (tx) tx.textContent = o.text; if (o.role) h.querySelector(".r").textContent = o.role; if (o.nameText) h.querySelector(".n").textContent = o.nameText; }
        hosts.push({ o, h });
      }
      const cap = mk(); cap.innerHTML = `<div class="vk"><div class="vk-cap${spec.capWide === false ? "" : " vk-cap--wide"}" style="top:${BAND_TOP * 100}%;display:none"><p></p></div></div>`;
      const grain = mk(); grain.innerHTML = '<div class="ok-grain"></div>';
      let end = null;
      if (spec.end) { end = mk(); end.className = "vk-multi"; end.style.opacity = 0; const c = EL[spec.end.card].card;
        await E.render(end, { size: "9x16", accent: "accent-1", slides: [c], labelFallback: false }); end.querySelectorAll("[data-count]").forEach((e) => e.remove()); }
      cur = { name: "__reel", hosts, cap: cap.querySelector(".vk-cap"), grain: grain.querySelector(".ok-grain"), end };
      await document.fonts.ready;
      await Promise.all([...document.querySelectorAll(".vk-multi img[src]")].map((i) => i.decode().catch(() => { throw new Error("image failed: " + i.src); })));
    }

    for (const { o, h } of cur.hosts) { const el = EL[o.name], lt = t - o.at; h.style.display = lt >= 0 && lt < el.dur ? "" : "none"; if (lt >= 0 && lt < el.dur) { if (el.custom) el.custom(h, lt); else pose(h, el.tl(el.dur), lt); } }
    const line = spec.captions.find((c) => t >= c.from && t < c.to);

    const f = Math.round(t * 24); cur.grain.style.backgroundPosition = `${(f * 97) % 256}px ${(f * 61) % 256}px`; // grain moves each frame
    if (cur.end) { const e = spec.end; cur.end.style.opacity = INOUT(clamp((t - e.at) / e.dissolve)); pose(cur.end, CARD_TL, t - e.at); }
