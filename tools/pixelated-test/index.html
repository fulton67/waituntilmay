<!doctype html><html><head><meta charset="utf-8"><title>pixelated test</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  video{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
  #pix{image-rendering:pixelated}
  #smooth{image-rendering:auto}
  .hide{visibility:hidden}
</style></head><body>
<video id="pix"    src="native.mp4" muted playsinline></video>
<video id="smooth" src="native.mp4" muted playsinline class="hide"></video>
<script>
window.ready=false;
const vs=[document.getElementById('pix'),document.getElementById('smooth')];
Promise.all(vs.map(v=>new Promise(r=>{
  v.addEventListener('loadeddata',()=>{v.currentTime=29.1;v.addEventListener('seeked',r,{once:true})},{once:true});
}))).then(()=>{window.ready=true});
window.show=function(which){
  document.getElementById('pix').classList.toggle('hide',which!=='pix');
  document.getElementById('smooth').classList.toggle('hide',which!=='smooth');
  return which;
};
window.info=function(){const v=document.getElementById('pix');return{
  dpr:devicePixelRatio, vw:v.videoWidth, vh:v.videoHeight,
  cw:v.clientWidth, ch:v.clientHeight, t:v.currentTime, ready:window.ready,
  cs:getComputedStyle(v).imageRendering};};
</script></body></html>
