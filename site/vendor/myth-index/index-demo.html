<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index Component</title>
<link rel="stylesheet" href="myth-index.css">
<style>
  body {
    margin: 0;
    min-height: 200vh;
    background: #D3E1E9;
    font-family: Arial, Helvetica, sans-serif;
  }
  .stage { padding-bottom: 80px; }
  .note {
    max-width: none;
    padding: 0 28px;
    margin-top: 160px;
    font: 400 12px/1.6 Arial, sans-serif;
    color: #46525a;
  }
  @media (max-width: 767px) { .note { padding: 0 12px; } }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<p class="note">
  Click <em>index</em>. Hover a row on a pointer device for the preview;
  Escape or a click outside closes the panel.
</p>

<script src="myth-index.js"></script>
<script>
  // Stand-in data. Swap for your own, or use mythIndex.fromDOM({...}) to read
  // rows out of a card grid already on the page.
  var THUMB = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150">' +
    '<rect width="120" height="150" fill="none"/>' +
    '<path d="M30 20h60l10 25-18 6v79H38V51l-18-6z" fill="#2b3a42"/></svg>');

  var names = [
    'house-blouse', 'floral cut-out blouse', 'bird vest', 'mini mini',
    'suited booties', 'delivery trousers', 'full-suit-trench', 'bird-trench-jumpsuit',
    'half-a-suit jumpsuit', 'casual jumpsuit', 'city-sky dress', 'bouqet skirt',
    'slip cocktail dress ii', 'mini-trench dress', 'suited-up dress', 'bouqet dress',
  ];

  var items = names.map(function (n, i) {
    return {
      href: '#' + n.replace(/\s+/g, '-'),
      title: n,
      price: '$' + (180 + i * 35),
      thumb: THUMB,
    };
  });

  var idx = mythIndex({ mount: document.getElementById('stage'), items: items });
</script>
</body>
</html>
