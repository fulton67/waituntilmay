<!doctype html>
<!-- Feed post P0053 rosacea (review site pair 1: use, hero). The v2 family (v2.html): cream paper, serif header, glass windows with a
     white rim, BEFORE / AFTER glass pill, the credit line. Rounded-rectangle windows (the whole face, so no circles).
     Marks: white only. The before's red zones are traced from the measured red map (ba/p0053.js, brand/scripts/ba_post_p0053.py),
     the same outlines dashed on the aligned after. Photos are cropped and scaled only. Sources are gitignored (ba/src/p0053).
     Render: NODE_PATH=node_modules node brand/scripts/render_stills.cjs ba/p0053 <out> -->
<meta charset="utf-8"><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://use.typekit.net/vzz0hgt.css">
<link rel="stylesheet" href="../stills.css">
<script src="p0053.js"></script>
<style>
.tile{background:var(--ivory);color:var(--navy)}
.hd{position:absolute;left:0;right:0;top:58px;text-align:center}
.hd .nm{font:500 34px/1 var(--serif);letter-spacing:.06em;text-transform:uppercase}
.hd .rule{width:64px;height:1px;background:currentColor;opacity:.35;margin:14px auto 12px}
.hd .sub{font:500 14px/1 var(--text);letter-spacing:.28em;text-transform:uppercase;opacity:.75}
.proc{position:absolute;left:0;right:0;text-align:center;font:500 40px/1 var(--serif);letter-spacing:.32em;text-transform:uppercase;padding-left:.32em}
.cap{position:absolute;left:0;right:0;text-align:center;font:500 15px/1.3 var(--text);letter-spacing:.22em;text-transform:uppercase;opacity:.72}
.credit{position:absolute;left:0;right:0;bottom:44px;text-align:center;font:400 15px/1.2 var(--text);letter-spacing:.02em;opacity:.6}
.win{position:absolute;overflow:hidden;background:#cfc9be}
.win img{position:absolute;display:block;max-width:none}
.frame{position:absolute;--r:34px}
.pill{position:absolute;z-index:7;padding:9px 18px;--r:99px}
.pill .lab{font:500 15px/1 var(--text);letter-spacing:.2em;text-transform:uppercase}
.fig{position:absolute;z-index:7;text-align:left}
.fig b{display:block;font:500 15px/1 var(--text);letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-bottom:10px}
.fig span{font:400 64px/1 var(--disp);letter-spacing:-.02em}
.fig i{font:500 32px/1 var(--serif);font-style:italic;opacity:.6;margin:0 14px}
.fig.sm span{font-size:40px}.fig.sm i{font-size:24px;margin:0 10px}
svg.ov{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:6}
.plate{position:absolute;--r:30px;padding:10px 34px;z-index:4}
.zr{display:grid;grid-template-columns:1fr 110px 40px 110px;align-items:baseline;padding:13px 0;border-top:1px solid rgba(21,34,53,.14)}
.zr:first-child{border-top:0}
.zr b{font:500 15px/1 var(--text);letter-spacing:.2em;text-transform:uppercase}
.zr span{font:400 34px/1 var(--disp);letter-spacing:-.01em;text-align:right}
.zr i{font:500 22px/1 var(--serif);font-style:italic;opacity:.55;text-align:center}
.zr.hd2 b,.zr.hd2 span{font:500 13px/1 var(--text);letter-spacing:.2em;text-transform:uppercase;opacity:.6}
</style>
<div id="stage">
<div class="tile" id="hero" data-name="post_rosacea_P0053_hero"></div>
<div class="tile" id="s2" data-name="post_rosacea_P0053_slide2"></div>
</div>
<script>
const D = window.P53, NS = "http://www.w3.org/2000/svg", [PW, PH] = D.source.panel_wh;
const SRC = { b: "src/p0053/before.jpg", a: "src/p0053/after.jpg" };
const div = (t, cls, css, html) => { const d = document.createElement("div"); if (cls) d.className = cls; Object.assign(d.style, css || {}); if (html != null) d.innerHTML = html; t.appendChild(d); return d; };
const px = (o) => { const r = {}; for (const k in o) r[k] = typeof o[k] === "number" && k !== "zIndex" ? o[k] + "px" : o[k]; return r; };
function header(t) { div(t, "hd", {}, `<div class="nm">Dr. Ariel Ostad</div><div class="rule"></div><div class="sub">Total skin health</div>`); }
function credit(t) { div(t, "credit", {}, "Patient of Dr. Ostad. Individual results vary."); }
function pill(t, text, x, y) { return div(t, "glass pill", px({ left: x, top: y }), `<div class="lab">${text}</div>`); }
function svg(t) { const s = document.createElementNS(NS, "svg"); s.setAttribute("class", "ov"); s.setAttribute("width", 1080); s.setAttribute("height", 1350); t.appendChild(s);
  s.innerHTML = `<defs><filter id="sh${t.id}" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="-1" dy="1.5" stdDeviation="1.6" flood-color="#1d1a16" flood-opacity=".38"/></filter></defs><g class="m" filter="url(#sh${t.id})"></g>`; return s; }
function el(s, tag, at) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); s.querySelector("g.m").appendChild(e); return e; }
// a photo window: panel rect `view` [x0,y0,x1,y1] (cover-fit) in box; returns panel->tile mapper
function win(t, key, view, box, r, z = 3) {
  const [x0, y0, x1, y1] = view, s = Math.max(box.w / (x1 - x0), box.h / (y1 - y0));
  const ox = (x0 + x1) / 2 - box.w / s / 2, oy = (y0 + y1) / 2 - box.h / s / 2;
  const d = div(t, "win", px({ left: box.x, top: box.y, width: box.w, height: box.h, borderRadius: r, zIndex: z }));
  const im = document.createElement("img"); im.src = SRC[key]; Object.assign(im.style, px({ width: PW * s, height: PH * s, left: -ox * s, top: -oy * s })); d.appendChild(im);
  if (s > 1.001) console.error("upscaled window", key, s);
  return { d, s, map: (X, Y) => [box.x + (X - ox) * s, box.y + (Y - oy) * s] };
}
function glassFrame(t, box, pad, r, z = 2) { const g = div(t, "glass frame", px({ left: box.x - pad, top: box.y - pad, width: box.w + 2 * pad, height: box.h + 2 * pad, zIndex: z })); g.style.setProperty("--r", r + "px"); return g; }
const path = (pts, map) => pts.map(([x, y], i) => { const [X, Y] = map(x, y); return `${i ? "L" : "M"}${X.toFixed(1)} ${Y.toFixed(1)}`; }).join("") + "Z";
function outlines(s, W, after, w = 2.25) {
  for (const o of D.outlines) el(s, "path", { d: path(o.pts, W.map), fill: "none", stroke: "#fff", "stroke-width": after ? w * .9 : w, "stroke-linejoin": "round", "stroke-linecap": "round",
    ...(after ? { "stroke-dasharray": "2 6", opacity: .9 } : {}) });
}
const f1 = (v) => v.toFixed(1);
const [fx0, fy0, fx1, fy1] = D.face_box, fcx = (fx0 + fx1) / 2;
// the whole face with a little air: width ~ face + 15 %, the 4:5 window decides the height
const FV = (() => { const w = (fx1 - fx0) * 1.17, h = w * 1.25, cy = (D.lm.top[1] + D.lm.chin[1]) / 2 + 10; const y0 = Math.max(4, Math.min(cy - h / 2, PH - 4 - h)), x0 = Math.max(4, Math.min(fcx - w / 2, PW - 4 - w)); return [x0, y0, x0 + w, y0 + h]; })();

// ---------- slide 1, hero: the before large in a glass window with the red zones traced; the after overlapping, the same zones dashed ----------
{
  const t = document.getElementById("hero"); header(t);
  const box = { x: 72, y: 202, w: 640, h: 800 }, ab = { x: 666, y: 548, w: 340, h: 425 };
  const B = win(t, "b", FV, box, 30); glassFrame(t, box, 12, 42);
  const A = win(t, "a", FV, ab, 24, 5); glassFrame(t, ab, 10, 34, 4);
  const sv = svg(t); outlines(sv, B, false, 2.5); outlines(sv, A, true, 2);
  pill(t, "Before", box.x + 24, box.y + 24);
  pill(t, "After", ab.x + ab.w / 2 - 52, ab.y + ab.h + 26);
  div(t, "fig", px({ left: 110, top: 1046 }), `<b>Redness across the face</b><span>${f1(D.before.red_pct)}<i>to</i>${f1(D.after.red_pct)}<small style="font-size:30px"> %</small></span>`);
  div(t, "fig sm", px({ left: 680, top: 1062 }), `<b>Tone spread (SD)</b><span>${f1(D.before.a_sd_face)}<i>to</i>${f1(D.after.a_sd_face)}</span>`);
  div(t, "cap", { top: "1196px", left: "110px", right: "auto", textAlign: "left" }, "Rosacea · Redness · full face");
  credit(t);
}

// ---------- slide 2, the measured detail: the pair small, then zone-by-zone red share as glass rows ----------
{
  const t = document.getElementById("s2"); header(t);
  const bb = { x: 118, y: 200, w: 404, h: 505 }, ab = { x: 558, y: 200, w: 404, h: 505 };
  const B = win(t, "b", FV, bb, 24); glassFrame(t, bb, 10, 34);
  const A = win(t, "a", FV, ab, 24); glassFrame(t, ab, 10, 34);
  const sv = svg(t); outlines(sv, B, false, 2); outlines(sv, A, true, 1.9);
  pill(t, "Before", bb.x + 20, bb.y + 20); pill(t, "After", ab.x + 20, ab.y + 20);
  const fmt = (v) => (v >= 10 ? Math.round(v) : v.toFixed(1)) + "<small style='font-size:18px'> %</small>";
  const order = ["cheek_r", "cheek_l", "nose", "chin", "forehead"];
  const rows = [`<div class="zr hd2"><b>Red share of each zone</b><span>Before</span><i></i><span>After</span></div>`]
    .concat(order.map((k) => `<div class="zr"><b>${D.names[k]}</b><span>${fmt(D.before.zones[k].red_pct)}</span><i>to</i><span>${fmt(D.after.zones[k].red_pct)}</span></div>`))
    .concat([`<div class="zr"><b>Whole face</b><span>${fmt(D.before.red_pct)}</span><i>to</i><span>${fmt(D.after.red_pct)}</span></div>`]);
  const pl = div(t, "glass plate", px({ left: 108, top: 748, width: 864 - 68 }), rows.join(""));
  pl.style.background = "linear-gradient(222deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 30%),rgba(255,255,255,.42)";
  div(t, "cap", { top: "1236px", fontSize: "13px", letterSpacing: ".16em" }, `Zone spread ${f1(D.before.zone_sd)} → ${f1(D.after.zone_sd)} · same landmark zones on both photos`);
  credit(t);
}
Promise.all([document.fonts.ready, ...[...document.images].map((i) => (i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; })))])
  .then(() => { window.__fonts = [...document.fonts].filter((f) => f.status === "loaded").map((f) => f.family); window.__ready = true; });
</script>
