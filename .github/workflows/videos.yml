name: videos

on:
  schedule:
    - cron: '0 * * * *'      # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          python -m pip install --upgrade --quiet yt-dlp pillow

      - name: Refresh videos.json and posters
        run: python scripts/refresh_feed.py

      - name: Rebuild the grid, the index-panel data and index.html
        run: python scripts/build_video_grid.py || true

      - name: Commit when changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain site/videos.json site/assets/yt site/index.html site/build/sie-grid.html site/build/videos-data.json)" ]; then
            echo "no change"; exit 0
          fi
          git config user.name  "sie-feed"
          git config user.email "noreply@anthropic.com"
          git add site/videos.json site/assets/yt site/index.html site/build/sie-grid.html site/build/videos-data.json
          git commit -m "chore(videos): refresh feed, posters, grid and index panel"
          git push

      - name: Summary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('site/videos.json',encoding='utf-8'))
          print(f"items: {d['count']}  channels: {len(d['channels'])}  generated: {d['generated']}")
          PY
