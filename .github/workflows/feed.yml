name: feed

on:
  schedule:
    - cron: '0 * * * *'      # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: python -m pip install --upgrade --quiet yt-dlp

      - name: Refresh videos.json and posters
        run: python scripts/refresh_feed.py

      - name: Commit when changed
        run: |
          if [ -z "$(git status --porcelain site/videos.json site/assets/yt)" ]; then
            echo "no change"; exit 0
          fi
          git config user.name  "sie-feed"
          git config user.email "noreply@anthropic.com"
          git add site/videos.json site/assets/yt
          git commit -m "chore(feed): refresh videos.json from the five sie channels"
          git push
